<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Momentos Preciosos</title>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #05000a; /* Un negro casi total con un toque de morado */
            color: #d1d1d1; /* Gris base */
            font-family: 'Alice', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Título con efecto plateado metálico */
        .silver-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-top: 60px;
            text-align: center;
            background: linear-gradient(to bottom, #cfcfcf 0%, #ffffff 50%, #9e9e9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
            letter-spacing: 2px;
        }

        /* Espacio para la foto principal */
        .photo-container {
            width: 85%;
            max-width: 700px;
            height: 450px;
            margin: 40px 0;
            border: 1px solid #7a7a7a; /* Borde plateado tenue */
            background: #111;
            box-shadow: 0 0 40px rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            overflow: hidden;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Texto Plateado */
        .silver-text-box {
            max-width: 800px;
            padding: 20px 40px 60px 40px;
            font-size: 1.2rem;
            line-height: 2;
            text-align: justify;
            /* Degradado plateado sutil para el texto */
            background: linear-gradient(135deg, #e0e0e0 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.1);
        }

        /* Navegación */
        .footer-nav {
            width: 100%;
            max-width: 800px;
            margin: 40px auto;
            text-align: right;
            padding-bottom: 50px;
        }

        .nav-link {
            color: #d1d1d1;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #555;
            margin-left: 10px;
            transition: 0.3s;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <h1 class="silver-title">Momentos Preciosos</h1>

    <div class="photo-container">
        <img src="tu-foto-preciosa.jpg" alt="Nuestro mejor momento">
    </div>

    <div class="silver-text-box">
        <p>
        Momentos preciosos que pase contigo:
            <br>
   casi inmortalizados en pixeles y amor
            <br>
 amor como tu no hay, me das abrazos 
que endulzan mis dias mas oscuros
            <br>
  besos que dejaron mis labios con el sabor
mas rico y bello que una vez tuve en mi cuerpo y corazoncito            
        </p>
    </div>

    <div class="footer-nav">
        <a href="pagina3.html" class="nav-link">← Anterior</a>
        <a href="indice.html" class="nav-link">Índice</a>
        <a href="pagina5.html" class="nav-link">Siguiente →</a>
    </div>

</body>
</html>
