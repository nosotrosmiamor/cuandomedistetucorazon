<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuestros Besos</title>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Alice', serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Contenedor de animaciones */
        .decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Corazones Flotantes */
        .heart {
            position: absolute;
            color: #bc13fe;
            font-size: 20px;
            opacity: 0.6;
            animation: float 10s infinite linear;
        }

        /* Dibujos de labios (SVG) */
        .lips {
            position: absolute;
            width: 50px;
            height: 30px;
            fill: #ff33aa;
            opacity: 0.5;
            filter: drop-shadow(0 0 5px #ff33aa);
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Contenido Principal */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 3.5rem;
            margin-bottom: 50px;
            text-shadow: 0 0 20px #bc13fe;
        }

        /* Grid de Fotos (5 fotos) */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-gap: 20px;
            margin-bottom: 50px;
        }

        .photo-item {
            background: #1a1a1a;
            border: 2px solid #bc13fe;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
            transition: transform 0.3s;
        }

        .photo-item:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Posicionamiento especial para las 5 fotos */
        .p1 { grid-column: span 3; height: 350px; }
        .p2 { grid-column: span 3; height: 350px; }
        .p3 { grid-column: span 2; height: 250px; }
        .p4 { grid-column: span 2; height: 250px; }
        .p5 { grid-column: span 2; height: 250px; }

        .nav-links {
            margin-top: 40px;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #bc13fe;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-link:hover { background: #bc13fe; }
    </style>
</head>
<body>

    <div class="decorations">
        <div class="heart" style="left: 10%; animation-delay: 0s;">❤</div>
        <div class="heart" style="left: 25%; animation-delay: 5s;">❤</div>
        <div class="heart" style="left: 50%; animation-delay: 2s;">❤</div>
        <div class="heart" style="left: 75%; animation-delay: 7s;">❤</div>
        <div class="heart" style="left: 90%; animation-delay: 4s;">❤</div>

        <svg class="lips" style="top: 15%; left: 5%;" viewBox="0 0 100 100">
            <path d="M10,50 Q25,30 50,45 Q75,30 90,50 Q75,75 50,65 Q25,75 10,50 Z M20,50 Q50,55 80,50" stroke="%23ff33aa" stroke-width="2" fill="none"/>
        </svg>
        <svg class="lips" style="top: 70%; right: 8%;" viewBox="0 0 100 100">
            <path d="M10,50 Q25,30 50,45 Q75,30 90,50 Q75,75 50,65 Q25,75 10,50 Z M20,50 Q50,55 80,50" stroke="%23ff33aa" stroke-width="2" fill="none"/>
        </svg>
    </div>

    <div class="main-content">
        <h1>Recuerdos de nuestros besos</h1>

        <div class="photo-grid">
            <div class="photo-item p1"><img src="beso1.jpg" alt="Foto 1"></div>
            <div class="photo-item p2"><img src="beso2.jpg" alt="Foto 2"></div>
            <div class="photo-item p3"><img src="beso3.jpg" alt="Foto 3"></div>
            <div class="photo-item p4"><img src="beso4.jpg" alt="Foto 4"></div>
            <div class="photo-item p5"><img src="beso5.jpg" alt="Foto 5"></div>
        </div>

        <div class="nav-links">
            <a href="pagina2.html" class="nav-link">← Anterior</a>
            <a href="indice.html" class="nav-link">Índice</a>
            <a href="pagina4.html" class="nav-link">Siguiente →</a>
        </div>
    </div>

</body>
</html>
