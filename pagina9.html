<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tus Cartas</title>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Alice', serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #bc13fe;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(188, 19, 254, 0.5);
        }

        /* Estilo de las fotos (marcos plateados) */
        .photo-frame {
            background: #111;
            border: 1px solid #aaa; /* Borde plateado */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 2px;
            overflow: hidden;
        }

        .photo-frame img {
            width: 90%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Estilo del texto pequeño */
        .letter-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #d1d1d1;
            padding: 15px 0;
            max-width: 300px;
        }

        /* Bloque 1: Foto Grande y texto pequeño debajo */
        .big-block {
            margin-bottom: 80px;
            text-align: center;
        }
        .photo-big {
            width: 50%;
            height: 500px;
            margin-bottom: 20px;
        }

        /* Bloques en Zig-Zag */
        .row {
            display: flex;
            flex-direction: column;
            margin-bottom: 60px;
        }

        /* Alineación a la Izquierda */
        .align-left { align-items: flex-start; text-align: left; }

        /* Alineación a la Derecha */
        .align-right { align-items: flex-end; text-align: right; }

        .photo-small {
            width: 350px;
            height: 250px;
        }

        /* Navegación al centro */
        .footer-nav {
            text-align: center;
            padding: 80px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border: 1px solid #bc13fe;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background: #bc13fe;
            box-shadow: 0 0 20px #bc13fe;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tus Cartas</h1>

        <div class="big-block">
            <div class="photo-frame photo-big">
                <img src="carta_grande.jpg" alt="Nuestra mejor carta">
            </div>
            <div class="letter-text" style="max-width: 0%;">
  </div>
        </div>

        <div class="row align-left">
            <div class="photo-frame photo-small">
                <img src="carta1.jpg" alt="Carta 1">
            </div>
            <div class="letter-text">( Texto breve de la carta o recuerdo... )</div>
        </div>

        <div class="row align-right">
            <div class="photo-frame photo-small">
                <img src="carta2.jpg" alt="Carta 2">
            </div>
            <div class="letter-text">( Texto breve de la carta o recuerdo... )</div>
        </div>

        <div class="row align-left">
            <div class="photo-frame photo-small">
                <img src="carta3.jpg" alt="Carta 3">
            </div>
            <div class="letter-text">( Texto breve de la carta o recuerdo... )</div>
        </div>

        <div class="row align-right">
            <div class="photo-frame photo-small">
                <img src="carta4.jpg" alt="Carta 4">
            </div>
            <div class="letter-text">( Texto breve de la carta o recuerdo... )</div>
        </div>

        <div class="row align-left">
            <div class="photo-frame photo-small">
                <img src="carta5.jpg" alt="Carta 5">
            </div>
            <div class="letter-text">( Texto breve de la carta o recuerdo... )</div>
        </div>

    </div>

    <div class="footer-nav">
        <a href="pagina8.html" class="nav-link">← Anterior</a>
        <a href="indice.html" class="nav-link">Índice</a>
        <a href="pagina10.html" class="nav-link">Siguiente →</a>
    </div>

</body>
</html>
