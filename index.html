<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portada</title>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a; /* Gris muy oscuro para resaltar la foto */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Alice', serif;
        }

        .book-cover {
            max-width: 90%;
            max-height: 80vh;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 5px 15px 15px 5px; /* Efecto lomo de libro */
            border-left: 10px solid #333;
            transition: transform 0.5s;
        }

        .book-cover:hover {
            transform: scale(1.02);
        }

        .nav-link {
            margin-top: 30px;
            color: #bc13fe;
            text-decoration: none;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <img src="portada.jpg" alt="Portada del Libro" class="book-cover">

    <a href="pagina1.html" class="nav-link">Siguiente página →</a>

    <a href="indice.html" class="nav-link">Indice →</a>

</body>
</html>
